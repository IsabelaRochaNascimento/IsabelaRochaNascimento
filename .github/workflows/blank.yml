name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: IsabelaRochaNascimento
          outputs: |
            dist/github-snake.svg?color_snake=%2338BDF8&color_dots=%230D1117%23%23BAE6FD%2C%237DD3FC%2C%2338BDF8%2C%232563EB%2C%231D4ED8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
